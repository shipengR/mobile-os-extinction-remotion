name: Render Remotion video

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FEISHU_FOLDER_TOKEN: Mk4ifVbusl63bidLFtHc2PS2n6f

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0t64 \
            libnspr4 libnss3 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxrandr2 xdg-utils

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check project
        run: npm run typecheck

      - name: Install and verify Remotion browser
        run: npx remotion browser ensure

      - name: Render video with software Chromium rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CHROME_HEADLESS: '1'
        run: |
          set -euxo pipefail
          mkdir -p out
          npx remotion render src/index.ts MobileOSExtinction out/mobile-os-extinction.mp4 \
            --concurrency=1 \
            --gl=swiftshader \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-sandbox
          test -s out/mobile-os-extinction.mp4

      - name: Upload rendered video to Feishu
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          if [ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ]; then
            node scripts/upload-to-feishu.mjs
          else
            echo "Feishu credentials are not configured; skipping upload."
          fi

      - name: Upload rendered video artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-os-extinction-video
          path: out/mobile-os-extinction.mp4
          if-no-files-found: error
