name: Render Remotion video

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PAGES_BASE_PATH: mobile-os-extinction-remotion

jobs:
  render:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk libasound2 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libnss3 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxrandr2 xdg-utils

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check project
        run: npm run typecheck

      - name: Install and verify Remotion browser
        run: npx remotion browser ensure

      - name: Render browser-compatible MP4
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CHROME_HEADLESS: '1'
        run: |
          set -euxo pipefail
          mkdir -p out
          npx remotion render src/index.tsx MobileOSExtinction out/mobile-os-extinction.mp4 \
            --concurrency=1 \
            --gl=swiftshader \
            --chromium-options='{"args":["--disable-dev-shm-usage","--no-sandbox","--disable-gpu"]}' \
            --pixel-format=yuv420p
          test -s out/mobile-os-extinction.mp4

      - name: Publish MP4 as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ github.run_number }}
          name: Render ${{ github.run_number }}
          generate_release_notes: false
          files: out/mobile-os-extinction.mp4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-os-extinction-video
          path: out/mobile-os-extinction.mp4
          if-no-files-found: error
          retention-days: 30
