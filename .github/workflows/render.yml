name: Render Remotion video

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  FEISHU_FOLDER_TOKEN: Mk4ifVbusl63bidLFtHc2PS2n6f

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing fonts-noto-cjk

      - name: Install dependencies
        run: npm install

      - name: Type-check project
        run: npm run typecheck

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run build -- --gl=angle

      - name: Upload rendered video to Feishu
        if: ${{ secrets.FEISHU_APP_ID != '' && secrets.FEISHU_APP_SECRET != '' }}
        run: node scripts/upload-to-feishu.mjs

      - name: Upload rendered video artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-os-extinction-video
          path: out/mobile-os-extinction.mp4
          if-no-files-found: error
