name: Render Remotion video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm install

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src.tsx MobileOSExtinction out/mobile-os-extinction.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: mobile-os-extinction-video
          path: out/mobile-os-extinction.mp4
          if-no-files-found: error
